# Mãozinha — ambiente completo (PostgreSQL + backend Spring Boot + frontend React/nginx)
# Uso: copie .env.example para .env, preencha e rode `docker compose up --build`.
# Documentação completa: DOCKER.md

name: maozinha

services:

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maozinha}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      # Lida apenas pelo script de inicialização para criar o role maozinha_app
      MAOZINHA_APP_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD no arquivo .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      # Schema SQL versionado no repositório do backend (db/maozinha.sql)
      - type: bind
        source: ${BACKEND_DIR:-../maozinha-backend}/db
        target: /schema
        read_only: true
        bind:
          create_host_path: false
    ports:
      # Exposto só no próprio computador, para ferramentas como DBeaver/pgAdmin
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ${BACKEND_DIR:-../maozinha-backend}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Spring Boot converte estas variáveis em spring.datasource.* (não exige mudar o código)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-maozinha}
      SPRING_DATASOURCE_USERNAME: maozinha_app
      SPRING_DATASOURCE_PASSWORD: ${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      # Obrigatório: o backend valida o formato deste e-mail ao iniciar
      MAIL_USERNAME: ${MAIL_USERNAME:?Defina MAIL_USERNAME no arquivo .env}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # Sem isto o /actuator/health fica DOWN quando o SMTP não está configurado
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      # Acesso direto à API pelo host (opcional; o navegador usa o proxy do frontend)
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
