server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: resolve "backend" a cada requisição,
    # assim o proxy continua funcionando se o container do backend for recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy da API: o navegador chama /api na mesma origem do frontend
    # e o nginx encaminha para o serviço "backend" na rede interna.
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        # Mantém o Host original para o backend tratar a requisição como mesma origem (sem CORS).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash gerados pelo Vite podem ficar em cache por muito tempo.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida devolve o index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
